- id: live_tv_player
  route: "/live-tv/player"
  component: "/Volumes/mba2t/projects/moonfin-mobile-desktop/lib/ui/screens/livetv/live_tv_player_screen.dart::LiveTvPlayerScreen"
  screenshot_path: "/Volumes/mba2t/projects/moonfin-mobile-desktop/docs/ui/screenshots/live_tv_player.png"
  ui_tree: |
    PopScope
    -> Scaffold black
       -> Focus/GestureDetector/MouseRegion
          -> Stack
             -> video surface(Media3VideoView/NativeVideoView/Video)
             -> StreamBuilder buffering indicator
             -> top overlay
             -> bottom overlay(channel/program controls)
  state_bindings:
  - channels/startIndex props 来自 route extra。
  - PlaybackManager、MediaKitPlayerBackend、MediaServerClient、UserPreferences 驱动播放与频道切换。
  - bufferingStream 来自 PlayerState。
- id: video_player
  route: "/player/video"
  component: "/Volumes/mba2t/projects/moonfin-mobile-desktop/lib/ui/screens/playback/video_player_screen.dart::VideoPlayerScreen"
  screenshot_path: "/Volumes/mba2t/projects/moonfin-mobile-desktop/docs/ui/screenshots/video_player.png"
  ui_tree: |
    PopScope
    -> Scaffold black
       -> Focus/GestureDetector/MouseRegion
          -> Stack
             -> video surface(Media3/NativeVideoView/media_kit Video)
             -> overlays:
                -> buffering indicator
                -> top metadata/actions
                -> center transport/seek prompts
                -> bottom controls
                   -> progress area
                      -> StreamBuilder(position)
                      -> StreamBuilder(duration)
                      -> StreamBuilder(buffer)
                      -> Slider(value=positionMs, secondaryTrackValue=visibleBufferMs)
                   -> buttons/audio/subtitle/quality/cast
                -> next-up/still-watching/skip prompts
  state_bindings:
  - PlaybackManager.state 提供 positionStream/durationStream/bufferStream/bufferingStream、queue/current item。
  - MediaKitPlayerBackend/Media3 backend 提供视频 surface。
  - Slider 的 secondaryTrackValue 绑定 PlayerState.buffer，只有 buffer > position + 1s 时显示。
  - UserPreferences 控制 skip 长度、hardware decoding、字幕、OSD、external player、streaming cache UI 颜色等。
  - CastService/NativeCastChannel/NativeDlnaChannel/NativeAirPlayChannel 提供投屏状态和操作。
