shared_shells:
  navigation_layout:
    component: "/Volumes/mba2t/projects/moonfin-mobile-desktop/lib/ui/widgets/navigation_layout.dart::NavigationLayout"
    bindings:
    - activeRoute/showBackButton/showNavigationChrome 由调用页面传入。
    - 左侧/顶部导航库入口来自 UserViewsRepository 与 UserPreferences 导航设置。
  admin_shell:
    route: "/admin/*"
    component: "/Volumes/mba2t/projects/moonfin-mobile-desktop/lib/ui/screens/admin/admin_shell_screen.dart::AdminShellScreen"
    ui_tree: |
      AdminWebSocketHandler
      -> Scaffold
         -> AppBar(Server Administration, menu/back/home actions)
         -> Drawer/AdminDrawer 或左侧固定 sidebar
         -> child admin page
    state_bindings:
    - child 来自 ShellRoute 子路由。
    - AdminWebSocketHandler 监听 socketHandlerProvider，并 invalidate adminLibrariesProvider/adminTasksProvider/adminInstalledPluginsProvider/adminUsersListProvider 等。
    - AdminDrawer 读取 UserPreferences 中的管理菜单顺序/折叠状态。
pages:
- id: startup
  route: "/"
  component: "/Volumes/mba2t/projects/moonfin-mobile-desktop/lib/ui/screens/auth/startup_screen.dart::StartupScreen"
  screenshot_path: "/Volumes/mba2t/projects/moonfin-mobile-desktop/docs/ui/screenshots/startup.png"
  ui_tree: |
    RequestInitialFocus
    -> Scaffold
       -> gradient Container
          -> Center
             -> FadeTransition
                -> Column
                   -> logo Image.asset
                   -> CircularProgressIndicator
  state_bindings:
  - 启动跳转逻辑读取 SessionRepository、ServerRepository、CredentialStore、AuthenticationPreferences、PreferenceStore。
  - bootstrapActiveSession 来自 router query `bootstrap=1`。
- id: server_select
  route: "/server-select"
  component: "/Volumes/mba2t/projects/moonfin-mobile-desktop/lib/ui/screens/auth/server_select_screen.dart::ServerSelectScreen"
  screenshot_path: "/Volumes/mba2t/projects/moonfin-mobile-desktop/docs/ui/screenshots/server_select.png"
  ui_tree: |
    LoginScaffold
    -> header logo
    -> Column
       -> Saved Servers section
          -> _FocusableTile per Server
       -> Discovered Servers section
          -> _FocusableTile per discovered server / spinner / empty text
       -> footer actions
          -> Add Server button
          -> Emby Connect button
  state_bindings:
  - saved servers 来自 ServerRepository.servers。
  - discovered servers 是页面本地 `_discoveredServers`，由发现流程 setState 更新。
  - 版本 footer 来自 DeviceInfo.appVersion。
  - 新增服务器对话框使用 UserPreferences 存储手动服务器历史。
- id: emby_connect
  route: "/emby-connect"
  component: "/Volumes/mba2t/projects/moonfin-mobile-desktop/lib/ui/screens/auth/emby_connect_screen.dart::EmbyConnectScreen"
  screenshot_path: "/Volumes/mba2t/projects/moonfin-mobile-desktop/docs/ui/screenshots/emby_connect.png"
  ui_tree: |
    LoginScaffold
    -> header/logo
    -> credentials/code form
    -> server result list
    -> action buttons and error text
  state_bindings:
  - 连接流程由 EmbyConnectRepository 驱动。
  - 用户选定服务器写入 UserPreferences/ServerRepository 后进入 Server/Login 流程。
  - loading/error/server list 为页面本地 State。
- id: server_users
  route: "/server"
  component: "/Volumes/mba2t/projects/moonfin-mobile-desktop/lib/ui/screens/auth/server_screen.dart::ServerScreen"
  screenshot_path: "/Volumes/mba2t/projects/moonfin-mobile-desktop/docs/ui/screenshots/server_users.png"
  ui_tree: |
    LoginScaffold
    -> logo
    -> server name
    -> "Who's Watching" title
    -> optional login disclaimer
    -> user row/avatar tiles
    -> Add User / Select Server buttons
    -> error text
  state_bindings:
  - serverId prop 来自 query。
  - 服务器详情来自 ServerRepository。
  - 用户列表来自 ServerUserRepository。
  - 自动登录/鉴权使用 AuthRepository、SessionRepository、MediaServerClientFactory、AuthenticationPreferences。
- id: login
  route: "/login"
  component: "/Volumes/mba2t/projects/moonfin-mobile-desktop/lib/ui/screens/auth/login_screen.dart::LoginScreen"
  screenshot_path: "/Volumes/mba2t/projects/moonfin-mobile-desktop/docs/ui/screenshots/login.png"
  ui_tree: |
    PopScope
    -> LoginScaffold
       -> logo
       -> title/sign-in server subtitle
       -> QuickConnect/Password segmented buttons when supported
       -> QuickConnect content OR credential form
       -> TV keyboard footer spacer
  state_bindings:
  - serverId/prefillUsername/hasPassword props 来自 query。
  - 登录验证调用 AuthRepository，成功后写 SessionRepository/UserPreferences。
  - 服务器、客户端能力来自 ServerRepository 与 MediaServerClientFactory。
- id: home
  route: "/home"
  component: "/Volumes/mba2t/projects/moonfin-mobile-desktop/lib/ui/screens/home/home_screen.dart::HomeScreen"
  screenshot_path: "/Volumes/mba2t/projects/moonfin-mobile-desktop/docs/ui/screenshots/home.png"
  ui_tree: |
    ResponsiveLayout
    -> _HomeShell
       -> Scaffold
          -> NavigationLayout(activeRoute:/home)
             -> Stack
                -> optional _Backdrop
                -> _GradientScrim
                -> _ContentRows
                   -> optional MediaBar
                   -> ListView rows
                      -> LibraryRow / LiveTv row / Library buttons row / Media row
                         -> GridButtonCard or MediaCard
                   -> optional InfoArea selected item overlay
                -> optional SeasonalEffects
  state_bindings:
  - HomeViewModel.rows 来自 RowDataSource、MultiServerRepository、MediaServerClient 与 activeHomeSectionConfigs。
  - MediaBarViewModel.state 绑定到 MediaBar。
  - 背景图来自 BackgroundService.backgroundStream/currentUrl。
  - UserPreferences 控制 posterSize、backdropEnabled、watchedIndicatorBehavior、focusColor、seasonalEffect。
  - RouteLifecycleObserver/homeRefreshBus 触发 HomeViewModel.refresh/load。
- id: search
  route: "/search"
  component: "/Volumes/mba2t/projects/moonfin-mobile-desktop/lib/ui/screens/search/search_screen.dart::SearchScreen"
  screenshot_path: "/Volumes/mba2t/projects/moonfin-mobile-desktop/docs/ui/screenshots/search.png"
  ui_tree: |
    Scaffold
    -> NavigationLayout(showBackButton:true)
       -> SafeArea
          -> Column
             -> search input row
                -> voice activation
                -> TextField/CustomTVTextField
             -> Divider
             -> Expanded Focus
                -> idle/loading/error/results body
                   -> ListView
                      -> LibraryRow per SearchResultGroup
                         -> MediaCard per AggregatedItem
                      -> optional Seerr row
  state_bindings:
  - SearchViewModel 由 SearchRepository、MediaServerClient、scopedLibraryId 构造。
  - input onChanged 调用 searchDebounced，initialQuery 调用 searchImmediate。
  - results/seerrResults 分别来自 SearchRepository.search 与 SeerrRepository.search。
  - RecentSearchesStore 和 VoiceSearchController 管理历史与语音输入。
- id: advanced_filter
  route: "/advanced-filter"
  component: "/Volumes/mba2t/projects/moonfin-mobile-desktop/lib/ui/screens/filter/advanced_filter_screen.dart::AdvancedFilterScreen"
  screenshot_path: "/Volumes/mba2t/projects/moonfin-mobile-desktop/docs/ui/screenshots/advanced_filter.png"
