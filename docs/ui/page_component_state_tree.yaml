                -> body slivers
                   -> loading progress / error / empty
                   -> _ResultsHeaderSliver
                      -> _ResultsCount
                      -> _SortControls(SegmentedButton + direction button)
                   -> _ResultsGridSliver
                      -> MediaCard grid
  state_bindings:
  - AdvancedFilterViewModel 由 MediaServerClient、UserPreferences、AdvancedFilterCatalogRepository、AdvancedFilterCatalogSyncService 构造。
  - filter rows 绑定 vm.selectedTypes/Genres/Regions/Libraries/Years 与 vm.types/genres/regions/libraries/years。
  - 结果 grid 绑定 vm.results；加载进度绑定 vm.loadedItemCount/totalItemCount/loadingProgress。
  - 选择与排序写回 UserPreferences，并使用本地 catalog repository 缓存。
- id: library_browse
  route: "/library/:libraryId"
  component: "/Volumes/mba2t/projects/moonfin-mobile-desktop/lib/ui/screens/browse/library_browse_screen.dart::LibraryBrowseScreen"
